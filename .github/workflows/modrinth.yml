name: Modrinth

# Runs when a GitHub release is published, so nothing reaches Modrinth before the release itself,
# and the jar there is the one from the release rather than a second build of the same tag.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  SLUG: mapcamera
  DEPENDENCY_SLUG: mapgui
  # Adding a supported Minecraft version means adding it here.
  GAME_VERSIONS: '["26.2"]'
  LOADERS: '["paper"]'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      NOTES: ${{ github.event.release.body }}
    steps:
      - name: Check the token is set
        run: test -n "$MODRINTH_TOKEN" || { echo "::error::MODRINTH_TOKEN is not set"; exit 1; }

      - name: Take the jar from the release
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "MapCamera-$version.jar" --dir dist
          ls -l dist

      # The lookups are authenticated so they still work while the project is unlisted or waiting on
      # Modrinth's review queue - an anonymous GET returns 404 for those.
      - name: Publish to Modrinth
        run: |
          auth="Authorization: $MODRINTH_TOKEN"
          project=$(curl --fail-with-body -sS -H "$auth" "https://api.modrinth.com/v2/project/$SLUG" | jq -r .id)
          dependency=$(curl --fail-with-body -sS -H "$auth" "https://api.modrinth.com/v2/project/$DEPENDENCY_SLUG" | jq -r .id)
          data=$(jq -n \
            --arg name "MapCamera $VERSION" \
            --arg version "$VERSION" \
            --arg changelog "$NOTES" \
            --arg project "$project" \
            --arg dependency "$dependency" \
            --argjson game_versions "$GAME_VERSIONS" \
            --argjson loaders "$LOADERS" \
            '{name: $name, version_number: $version, changelog: $changelog, project_id: $project,
              game_versions: $game_versions, loaders: $loaders, version_type: "release", featured: true,
              dependencies: [{project_id: $dependency, dependency_type: "required"}],
              file_parts: ["file"], primary_file: "file"}')
          curl --fail-with-body -sS -X POST "https://api.modrinth.com/v2/version" \
            -H "$auth" -F data="$data" -F file=@"dist/MapCamera-$VERSION.jar" > response.json
          echo "published $(jq -r .id response.json)"
