name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # The jar is named from gradle.properties, not from the tag, so a tag pushed without bumping
      # that would attach a jar of the wrong version. Stop here instead of shipping it.
      - name: Check the tag against gradle.properties
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties" >&2
            exit 1
          fi

      - run: ./gradlew build

      - name: Attach the jar and the pack to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "MapCamera ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            build/libs/MapCamera-*.jar \
            build/distributions/MapCamera-resourcepack-*.zip
